# mihomo v1.18.10+ DNS 配置
# 防 DNS 泄漏和污染的完整配置方案
# 使用 direct-nameserver 替代 nameserver-policy

dns:
  enable: true
  listen: ':53'
  ipv6: true

  # 增强模式：fake-ip 模式提供更好的性能
  enhanced-mode: 'fake-ip'
  fake-ip-range: '198.18.0.1/16'
  fake-ip-filter-mode: 'blacklist'

  # 系统设置
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false

  # 缓存算法：arc 提供更好的缓存性能
  cache-algorithm: 'arc'

  # fake-ip 过滤列表 - 这些域名不使用 fake-ip
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - '+.lan'
    - '+.local'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'localhost.work.weixin.qq.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - 'www.msftconnecttest.com'

  # ============================================
  # mihomo v1.18.10+ 核心配置
  # ============================================

  # 基础 DNS 服务器（必须为 IP 地址或 TLS DNS）
  # 用于解析其他 DNS 服务器的域名
  default-nameserver:
    - 'tls://223.5.5.5'      # 阿里云 DNS over TLS
    - 'tls://223.6.6.6'      # 阿里云 DNS over TLS

  # 主 DNS 服务器 - 用于国外网站（走 MATCH 兜底规则）
  # 防止 DNS 泄漏和污染，必须使用国外 DNS
  nameserver:
    - 'https://cloudflare-dns.com/dns-query'  # Cloudflare DoH
    - 'https://dns.google/dns-query'          # Google DoH

  # 代理节点解析 DNS - 解析代理服务器地址时使用
  # 必须使用国内 DNS，否则可能无法连接到代理节点
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query'      # 阿里云 DoH
    - 'https://doh.pub/dns-query'             # 腾讯 DoH

  # 直连 DNS - 当规则匹配到 DIRECT 时使用
  # 使用国内 DNS 提供最佳速度
  direct-nameserver:
    - 'https://dns.alidns.com/dns-query'      # 阿里云 DoH
    - 'https://doh.pub/dns-query'             # 腾讯 DoH

  # ============================================
  # 关键配置：让 DNS 连接遵循代理规则
  # ============================================
  # 启用后，连接 nameserver 中的国外 DNS 时会通过代理
  # 这是防止 DNS 泄漏的关键配置
  respect-rules: true

  # direct-nameserver 跟随策略（v1.18.10+ 新增）
  # 设为 false 确保 direct-nameserver 始终直连
  direct-nameserver-follow-policy: false

  # ============================================
  # 重要：清除 fallback 相关配置
  # ============================================
  # v1.18.10+ 版本使用 direct-nameserver 替代 fallback
  # 保留空数组以覆盖订阅源的配置
  fallback: []

  # 清除 fallback-filter 配置
  # 设置为最小配置以覆盖订阅源
  fallback-filter:
    geoip: false
    geoip-code: ''
    ipcidr: []
    domain: []

# ============================================
# 配置说明
# ============================================
#
# 1. DNS 解析流程：
#    - 代理节点域名 → proxy-server-nameserver（国内 DNS）
#    - 直连域名 → direct-nameserver（国内 DNS）
#    - 代理域名 → nameserver（国外 DNS，通过代理连接）
#    - 未匹配域名 → nameserver（国外 DNS，通过代理连接）
#
# 2. 防 DNS 泄漏原理：
#    - respect-rules: true 让国外 DNS 连接走代理
#    - direct-nameserver 处理直连域名，避免国外 DNS
#    - proxy-server-nameserver 使用国内 DNS，确保能连接代理
#
# 3. 与订阅配置的关系：
#    - 此配置会覆盖订阅源的 DNS 设置
#    - 确保订阅源的 fallback 配置被清除
#    - rules 规则决定使用哪个 DNS 服务器
#
# 4. 使用方法：
#    - 手动导入：将此文件内容复制到 Clash 配置中
#    - Parsers 覆写：在 Parsers.yaml 中使用 mix-object 引入
#    - 直接替换：替换订阅配置中的 dns 字段
